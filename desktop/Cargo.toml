[package]
name = "frame-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "The frame shell's PC host services, linked into WiVRn's server"

[lib]
name = "frame_host"
crate-type = ["staticlib"]

[dependencies]
anyhow = "1"
dbus = "0.9"
frame-abi = { path = "../wayvr/frame-abi" }
glib = "0.21"
gstreamer = "0.24"
gstreamer-app = "0.24"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayvr-ipc = { path = "../wayvr/wayvr-ipc", default-features = false, features = ["runtime"] }
wlx-capture = { path = "../wayvr/wlx-capture", default-features = false, features = ["pipewire"] }
